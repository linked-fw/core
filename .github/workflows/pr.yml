name: PR

on:
  pull_request:
    branches:
      - main

jobs:
  checks:
    uses: linked-fw/.github/.github/workflows/pr.yml@v1
    # The changeset reminder posts a PR comment. A reusable workflow only holds what its
    # caller granted, and the org default is read-only.
    permissions:
      contents: read
      pull-requests: write
    with:
      require-tests: true
      # `test:ci` sets the live-test Fuseki (FUSEKI_BASE_URL, FUSEKI_ADMIN_PASSWORD) explicitly;
      # `npm test` never defaults them. It refuses to run outside GitHub Actions.
      test-script: test:ci
      run-e2e: false
